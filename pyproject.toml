[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant"
version = "0.1.0"
description = "Modular AI assistant example"
authors = [{name = "Smartburme", email = "you@example.com"}]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "pydantic>=2.8",
    "pytest>=8.2",
    "requests>=2.34",
]

[tool.setuptools.packages.find]
where = ["assistant"]
